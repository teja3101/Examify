{% extends 'base.html' %}

{% block content %}

<div class="form-box">

    <h2 class="page-title">Add New Question</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Question</label>
            <input type="text" name="qtext" placeholder="Enter question">
        </div>

        <div class="form-group">
            <label>Option 1</label>
            <input type="text" name="op1" placeholder="Option 1">
        </div>

        <div class="form-group">
            <label>Option 2</label>
            <input type="text" name="op2" placeholder="Option 2">
        </div>

        <div class="form-group">
            <label>Option 3</label>
            <input type="text" name="op3" placeholder="Option 3">
        </div>

        <div class="form-group">
            <label>Option 4</label>
            <input type="text" name="op4" placeholder="Option 4">
        </div>

        <div class="form-group">
            <label>Correct Answer</label>
            <input type="text" name="corr_answer" placeholder="Correct answer">
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" placeholder="Subject">
        </div>

        <button type="submit" class="btn">
            Add Question
        </button>

    </form>

</div>

{% endblock %}

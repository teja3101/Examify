{% extends 'base.html' %}

{% block content %}

<div class="table-container">

    <h2 class="page-title">All Users</h2>

    <table>

        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
        </tr>

        {% for u in users %}

        <tr>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.role }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}

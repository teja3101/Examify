{% extends 'base.html' %}

{% block content %}

<div class="login-wrapper">

    <!-- PROJECT TITLE -->
    <h1 class="project-title">ExamFusion</h1>

    <div class="login-box">

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username">
            <input type="password" name="password" placeholder="Password">

            <button type="submit">Login</button>

        </form>

    </div>

</div>

{% endblock %}

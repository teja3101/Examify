{% extends 'base.html' %}

{% block content %}

<div class="confirm-box">

    <h2>Are you sure you want to delete?</h2>

    <h3>{{ u.username }}</h3>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn danger">
            Yes Delete
        </button>

        <a href="/examapp/users/" class="btn">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
